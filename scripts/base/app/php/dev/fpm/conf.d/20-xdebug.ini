; ----------------------------------------------------------------------------------------------------------------------
; PHP Extension - Xdebug - FPM                                                                       https://xdebug.org/
; ----------------------------------------------------------------------------------------------------------------------
; Applies to the FPM SAPI only (web requests through nginx / symfony local server).
; The CLI counterpart lives in ../../cli/conf.d/20-xdebug.ini - keep both in sync.
;
; Required because the phpX.Y-xdebug package runs `phpenmod xdebug`, which defaults to ALL SAPIs.
; Without this file FPM would fall back to the packaged default (xdebug.mode=develop, always on),
; adding overhead to every web request.
;
; __PROJECT_PATH__ is substituted with the real project path by scripts/base/app/php/_install.sh.
; ----------------------------------------------------------------------------------------------------------------------
zend_extension=xdebug

; ----------------------------------------------------------------------------------------------------------------------
; Mode
; ----------------------------------------------------------------------------------------------------------------------
xdebug.mode=debug
;xdebug.mode=debug,profile

; ----------------------------------------------------------------------------------------------------------------------
; Mode - Debug
; ----------------------------------------------------------------------------------------------------------------------
; 'trigger' keeps the debugger dormant until XDEBUG_TRIGGER is present in the request
; (cookie / GET / POST), so idle requests stay close to zero overhead.
xdebug.start_with_request=trigger
;xdebug.start_upon_error=yes

; ----------------------------------------------------------------------------------------------------------------------
; Mode - Profile
; ----------------------------------------------------------------------------------------------------------------------
;xdebug.profiler_append=0
;xdebug.profiler_output_name=cachegrind.out.%p

; ----------------------------------------------------------------------------------------------------------------------
; Log files
; ----------------------------------------------------------------------------------------------------------------------
xdebug.var_display_max_children=128
xdebug.var_display_max_data=512
xdebug.var_display_max_depth=3

xdebug.log=__PROJECT_PATH__/app/var/log/xdebug-fpm.log
xdebug.log_level=0

; ----------------------------------------------------------------------------------------------------------------------
; Remote Host
; ----------------------------------------------------------------------------------------------------------------------
xdebug.client_discovery_header="HTTP_X_FORWARDED_FOR,REMOTE_ADDR"
xdebug.client_host=127.0.0.1
xdebug.client_port=9003
xdebug.connect_timeout_ms=600
xdebug.discover_client_host=false
;xdebug.idekey=PHPSTORM
